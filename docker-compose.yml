services:
  # 1. Backend Express (API nawaedutech)
  backend:
    build: ./server
    container_name: nawa_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    volumes:
      - backend_data:/app/data

  # 2. Frontend React+Vite (build -> nginx SPA)
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-http://backend:5000}
    container_name: nawa_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  backend_data:
